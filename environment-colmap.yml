name: ai6121-colmap
channels:
  - conda-forge
dependencies:
  # This workstation has a CUDA 13.0-capable NVIDIA driver. Keep COLMAP
  # separate from the Python baseline so its C++/Qt/CUDA stack cannot alter it.
  - colmap=4.1.1=cuda_130*
  # The 4.1.1 CUDA feedstock currently does not pull these runtime libraries
  # transitively, although the COLMAP executable links against their 3.1 ABI.
  - openimageio=3.1.*
